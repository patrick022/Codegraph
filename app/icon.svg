<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A selected file on the map: green edge in, amber edge out. Hex values
       mirror the tokens in globals.css; a favicon can't read CSS variables. -->
  <style>
    .bg { fill: #ffffff; stroke: #e3e3e6; }
    .node { fill: #ffffff; stroke: #a1a1aa; }
    .sel { fill: #2563eb; }
    .in { stroke: #15803d; }
    .out { stroke: #b45309; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151517; stroke: #26262a; }
      .node { fill: #151517; stroke: #52525b; }
      .sel { fill: #4d8bf5; }
      .in { stroke: #4ade80; }
      .out { stroke: #fbbf24; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="31" height="31" rx="6"/>
  <path class="in" d="M10 9 C13 9 12 16 13 16" fill="none" stroke-width="2"/>
  <path class="out" d="M19 16 C20 16 19 23 22 23" fill="none" stroke-width="2"/>
  <rect class="node" x="4" y="6" width="6" height="6" rx="1.5" stroke-width="1.5"/>
  <rect class="node" x="22" y="20" width="6" height="6" rx="1.5" stroke-width="1.5"/>
  <rect class="sel" x="12" y="12" width="8" height="8" rx="2"/>
</svg>
